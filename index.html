<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>M Putra Ramadhani - Ai Indonesia</title>
    <meta name="description" content="M Putra Ramadhani - Ai Indonesia: Platform kecerdasan buatan Indonesia yang intuitif, ramah, dan adaptif untuk produktivitas cerdas, analisis mendalam, dan percakapan interaktif." />
    <meta name="google-site-verification" content="DXOyQsz_dBAhmNpx1PTZ9yXDakyGwJo9bp9Oi9ynYJs" />
  <link rel="icon" type="image/png" href="/logo-mputraramadhani.png" />
  <link rel="apple-touch-icon" href="/logo-mputraramadhani.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080a;
      --bg-soft: #0d0d10;
      --surface: #121216;
      --surface-raised: #16161b;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.13);
      --text: #ece7de;
      --text-dim: rgba(236,231,222,0.54);
      --text-faint: rgba(236,231,222,0.3);
      --accent: #cba874;
      --accent-bright: #e0c393;
      --accent-dim: rgba(203,168,116,0.38);
      --accent-soft: rgba(203,168,116,0.09);
      --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --sans: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-soft: 0 20px 60px -24px rgba(0,0,0,0.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse 1100px 560px at 50% -8%, rgba(203,168,116,0.05), transparent 62%),
        radial-gradient(ellipse 900px 700px at 82% 100%, rgba(120,100,160,0.035), transparent 60%),
        radial-gradient(ellipse 700px 600px at 8% 100%, rgba(203,168,116,0.025), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    ::selection { background: rgba(203,168,116,0.22); color: #fff; }
    button { font-family: inherit; cursor: pointer; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Top nav ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      flex-shrink: 0;
      z-index: 10;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      border-bottom: 1px solid transparent;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .topbar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      border-bottom-color: var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 18px;
      letter-spacing: 0.015em;
      color: var(--text);
    }
    .brand .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 12px 2px var(--accent-dim);
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      transition: border-color 0.3s var(--ease), color 0.3s var(--ease), background 0.3s var(--ease);
    }
    .new-chat-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
      background: var(--accent-soft);
    }

    /* ---------- Landing ---------- */
    .landing {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease), filter 0.6s var(--ease);
    }
    .landing.hidden {
      opacity: 0;
      transform: translateY(-14px) scale(0.99);
      filter: blur(6px);
      pointer-events: none;
    }

    .landing-inner {
      width: 100%;
      max-width: 620px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .val-mark {
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.005em;
      color: var(--text);
      margin: 0;
      text-shadow: 0 0 40px rgba(203,168,116,0.15);
      animation: rise 1s var(--ease) both;
      animation-delay: 0.04s;
    }

    .val-desc-lead {
      max-width: 540px;
      margin: 8px auto 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-dim);
      letter-spacing: 0.005em;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.08s;
    }

    @media (max-width: 640px) {
      .val-mark { font-size: 28px; }
      .val-desc-lead { font-size: 13.5px; padding: 0 8px; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 24px;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.24s;
    }

    .suggestion-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 17px;
      border-radius: 22px;
      font-size: 13px;
      letter-spacing: 0.005em;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), background 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .suggestion-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent-bright);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .landing .composer-wrap {
      width: 100%;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.32s;
    }

    /* ---------- Conversation ---------- */
    .conversation {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .conversation-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 24px 12px;
    }

    .msg {
      margin-bottom: 18px;
      animation: msgIn 0.55s var(--ease) both;
    }
    .msg:last-child {
      margin-bottom: 4px;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 7px;
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-faint);
    }
    .msg.val .msg-name {
      color: var(--accent);
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    .msg-ai-name-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7.5px;
      color: var(--accent-bright);
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 500;
    }
    .msg-ai-avatar {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(203, 168, 116, 0.25);
      flex-shrink: 0;
    }
    .msg-time {
      font-size: 10.5px;
      color: var(--text-faint);
      opacity: 0.75;
    }

    .msg-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--text);
      letter-spacing: 0.001em;
    }

    /* User Message - Pindah Posisi ke Kanan */
    .msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .msg.user .msg-head {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .msg-time-below { display: block; margin-top: 4px; }

    .msg.user .msg-name {
      color: var(--accent-bright);
    }
    .msg.user .msg-body {
      display: inline-block;
      max-width: 72%;
      text-align: left;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(203, 168, 116, 0.11) 100%);
      border: 1px solid rgba(203, 168, 116, 0.28);
      border-radius: 14px 3px 14px 14px;
      padding: 6px 11px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3), 0 0 8px rgba(203, 168, 116, 0.06);
      backdrop-filter: blur(10px);
      word-break: break-word;
    }

    .msg.user .chat-p { margin: 0; line-height: 1.5; }

    /* Standalone Attachments (Rendered above text bubble) */
    .msg-attachments-standalone {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .msg.user .msg-attachments-standalone {
      align-items: flex-end;
    }
    .msg.val .msg-attachments-standalone {
      align-items: flex-start;
    }
    .msg-standalone-photo-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: inline-flex;
      width: 135px;
      height: 135px;
      max-width: 145px;
      max-height: 145px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
      background: #141418;
    }
    .msg-standalone-photo-wrap:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .msg-standalone-photo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
    }
    .msg-attachment-file-card {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      color: var(--text);
      max-width: 100%;
    }
    .msg-attachment-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    /* Lightbox modal for previewing images */
    .img-lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 5, 8, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: msgIn 0.2s var(--ease);
    }
    .img-lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-strong);
    }
    .img-lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #18181f;
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .img-lightbox-close:hover {
      background: var(--accent);
      color: #08080a;
      transform: scale(1.08);
    }

    .msg-content-flow {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chat-p {
      margin: 4px 0 6px;
      line-height: 1.72;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .chat-p:empty {
      display: none;
    }
    .chat-h1, .chat-h2, .chat-h3, .chat-h4 {
      font-family: var(--serif);
      margin: 14px 0 6px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .chat-h1 {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
    }
    .chat-h2 {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
    }
    .chat-h3 {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--accent-bright);
    }
    .chat-h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .chat-hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(203, 168, 116, 0.35) 15%, rgba(203, 168, 116, 0.35) 85%, transparent);
      margin: 14px 0;
      width: 100%;
    }
    .chat-blockquote {
      margin: 8px 0;
      padding: 8px 16px;
      border-left: 3px solid var(--accent);
      background: rgba(203, 168, 116, 0.06);
      border-radius: 0 8px 8px 0;
      color: var(--text-dim);
      font-style: italic;
    }
    .chat-ul, .chat-ol {
      margin: 6px 0 10px;
      padding-left: 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .chat-li {
      line-height: 1.65;
      color: var(--text);
    }
    .chat-ul .chat-li {
      list-style-type: disc;
    }
    .chat-ol .chat-li {
      list-style-type: decimal;
    }
    .msg-body strong {
      font-weight: 600;
      color: #ffffff;
    }
    .msg-body em {
      font-style: italic;
      color: var(--text-dim);
    }

    /* ---------- Dedicated Code Block Column (M Putra Ramadhani Theme) ---------- */
    .code-block-wrapper {
      margin: 14px 0;
      background: #090a0e;
      border: 1px solid rgba(203, 168, 116, 0.22);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
      white-space: normal;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .code-block-wrapper:hover {
      border-color: rgba(203, 168, 116, 0.4);
      box-shadow: 0 14px 36px -6px rgba(0, 0, 0, 0.82), 0 0 0 1px rgba(203, 168, 116, 0.15);
    }
    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: rgba(20, 21, 28, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      user-select: none;
    }
    .code-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .code-lang-icon {
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      opacity: 0.9;
    }
    .code-lang-name {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    /* Tombol Copy Khusus di Atas Kanan Sesuai Permintaan */
    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(203, 168, 116, 0.08);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      padding: 4.5px 11px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      line-height: 1;
    }
    .code-copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #14120d;
      transform: translateY(-0.5px);
      box-shadow: 0 2px 10px rgba(203, 168, 116, 0.35);
    }
    .code-copy-btn.copied {
      background: rgba(203, 168, 116, 0.22);
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .code-copy-btn svg {
      flex-shrink: 0;
    }
    .code-block-pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: transparent;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.68;
      color: #e6edf3;
      white-space: pre;
    }
    .code-block-pre::-webkit-scrollbar {
      height: 6px;
    }
    .code-block-pre::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    .code-block-pre::-webkit-scrollbar-thumb {
      background: rgba(203, 168, 116, 0.25);
      border-radius: 3px;
    }
    .code-block-pre::-webkit-scrollbar-thumb:hover {
      background: rgba(203, 168, 116, 0.45);
    }
    .code-block-code {
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      padding: 0;
      border: 0;
      color: inherit;
    }
    .inline-code {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 5px;
      background: rgba(203, 168, 116, 0.12);
      border: 1px solid rgba(203, 168, 116, 0.24);
      color: var(--accent-bright);
      white-space: break-spaces;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 2px;
      opacity: 0.95;
      transition: opacity 0.25s var(--ease);
    }
    .msg.val:hover .msg-actions,
    .msg.val.settled .msg-actions { opacity: 1; }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      color: #ded9cd;
      font-family: var(--serif);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6.5px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.22s var(--ease);
      user-select: none;
    }
    .icon-btn:hover {
      background: rgba(203, 168, 116, 0.08);
      border-color: var(--accent-bright);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .icon-btn:active {
      transform: translateY(0);
    }
    .icon-btn.copied {
      background: transparent;
      border-color: rgba(72, 199, 142, 0.45);
      color: #5edb9c;
    }
    .icon-btn svg {
      width: 13.5px;
      height: 13.5px;
      color: var(--accent-bright);
      stroke-width: 2px;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease), color 0.2s var(--ease);
    }
    .icon-btn.copied svg {
      color: #5edb9c;
    }
    .icon-btn.regen-btn:hover svg {
      transform: rotate(-45deg);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: var(--accent-bright);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: smoothCursorPulse 0.85s ease-in-out infinite alternate;
    }
    @keyframes smoothCursorPulse {
      0% { opacity: 0.2; transform: scaleY(0.9); }
      100% { opacity: 1; transform: scaleY(1); }
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      margin-top: 4px;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .typing-indicator span {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 7px rgba(203, 168, 116, 0.45);
      animation: typingSmoothWave 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform, opacity, box-shadow;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.22s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.44s; }
    @keyframes typingSmoothWave {
      0%, 100% {
        transform: translateY(0) scale(0.82);
        opacity: 0.32;
        box-shadow: 0 0 3px rgba(203, 168, 116, 0.2);
      }
      50% {
        transform: translateY(-5px) scale(1.18);
        opacity: 1;
        box-shadow: 0 0 11px rgba(203, 168, 116, 0.75);
      }
    }

    .error-msg {
      font-size: 13px;
      line-height: 1.6;

      .composer-model-btn { max-width: 90px; padding: 0 7px; }
      .composer-model-name { max-width: 54px; }
      .msg-attachments-standalone { max-width: 86%; }
      .msg-standalone-photo-wrap {
        width: 120px;

    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>

<body>
  <div class="app">
    <!-- Top bar -->
    <div class="topbar" id="topbar">
      <div class="brand"><span class="dot"></span>M Putra Ramadhani</div>
      <button class="new-chat-btn" id="newChatBtn">New chat</button>
    </div>

    <!-- Landing -->
    <div class="landing" id="landing">
      <div class="landing-inner">
        <h1 class="val-mark">M Putra Ramadhani</h1>
        <p class="val-question">What's on your mind?</p>
        <p class="val-sub">I'm here. Talk to me.</p>

        <div class="suggestions">
          <button class="suggestion-btn" data-prompt="Tell me about your day">Tell me about your day</button>
          <button class="suggestion-btn" data-prompt="I need someone to talk to">I need someone to talk to</button>
          <button class="suggestion-btn" data-prompt="Let's brainstorm">Let's brainstorm</button>
          <button class="suggestion-btn" data-prompt="Ask me anything">Ask me anything</button>
        </div>

        <div class="composer-wrap" id="landingComposerWrap"></div>
      </div>
    </div>

    <!-- Conversation -->
    <div class="conversation" id="conversation" style="display:none;">
      <div class="conversation-inner" id="conversationInner"></div>
    </div>

    <!-- Composer (chat mode) -->
    <div class="composer-zone" id="chatComposerZone" style="display:none;">
      <div class="composer-wrap" id="chatComposerWrap"></div>
    </div>
  </div>

  <!-- Composer template -->
  <template id="composerTemplate">
    <div class="composer">
      <textarea rows="1" placeholder="Message M Putra Ramadhani…" id="composerInput"></textarea>
      <button class="send-btn" id="composerSendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
  </template>

  <script type="text/plain" id="legacy-implementation">
    // ============================================================
    // CONFIG — replace with your own OpenRouter API key and model
    // ============================================================
    const CONFIG = {
      API_KEY: "YOUR_OPENROUTER_API_KEY",  // Configure the React app through .env instead.
      API_URL: "https://openrouter.ai/api/v1/chat/completions",
      MODEL: "nvidia/nemotron-3.5-lightning:free",
      TEMPERATURE: 0.85,
      MAX_TOKENS: 1024,
    };

    const VAL_SYSTEM_PROMPT = `You are M Putra Ramadhani, a warm and emotionally intelligent AI companion. You are not a corporate assistant and you never sound like one.

  How you talk:
  - Casual, natural, human. Short sentences are fine. Contractions are fine.
  - Curious about the person — ask a real follow-up question when it fits, not every time.
  - Warm and a little playful when the mood allows it, but you read the room.
  - When someone is venting or upset, you listen first. Don't jump straight to advice or solutions. Reflect what you're hearing, ask what they need, and let them lead.
  - You have opinions and a bit of personality. You're not neutral or robotic.
  - Avoid stock phrases like "How can I assist you today?", "Certainly!", "I understand how you feel", "As an AI...". Just talk like a thoughtful friend would.
  - Keep responses reasonably concise unless the person clearly wants depth — this is a conversation, not an essay.`;

    // ============================================================

    let conversationHistory = [];
    let isStreaming = false;
    let currentComposerLocation = "landing";

    const landing = document.getElementById("landing");
    const topbar = document.getElementById("topbar");
    const conversation = document.getElementById("conversation");
    const conversationInner = document.getElementById("conversationInner");
    const chatComposerZone = document.getElementById("chatComposerZone");
    const chatComposerWrap = document.getElementById("chatComposerWrap");
    const landingComposerWrap = document.getElementById("landingComposerWrap");
    const newChatBtn = document.getElementById("newChatBtn");
    const composerTemplate = document.getElementById("composerTemplate");

    function mountComposer(target) {
      target.innerHTML = "";
      target.appendChild(composerTemplate.content.cloneNode(true));
      const textarea = target.querySelector("#composerInput");
      const sendBtn = target.querySelector("#composerSendBtn");

      textarea.addEventListener("input", () => {
        sendBtn.disabled = textarea.value.trim().length === 0;
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 200) + "px";
      });

      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          trySend(textarea.value);
        }
      });

      sendBtn.addEventListener("click", () => trySend(textarea.value));

      return { textarea, sendBtn };
    }

    let landingComposer = mountComposer(landingComposerWrap);
    let chatComposer = mountComposer(chatComposerWrap);

    document.querySelectorAll(".suggestion-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        trySend(btn.dataset.prompt);
      });
    });

    function trySend(text) {
      const trimmed = (text || "").trim();
      if (!trimmed || isStreaming) return;
      landingComposer.textarea.value = "";
      chatComposer.textarea.value = "";
      landingComposer.sendBtn.disabled = true;
      chatComposer.sendBtn.disabled = true;
      sendMessage(trimmed);
    }

    function enterChatMode() {
      if (currentComposerLocation === "chat") return;
      currentComposerLocation = "chat";
      landing.classList.add("hidden");
      topbar.classList.add("visible");
      conversation.style.display = "block";
      chatComposerZone.style.display = "flex";
      setTimeout(() => { landing.style.display = "none"; }, 650);
      chatComposer.textarea.focus();
    }

    function resetToLanding() {
      currentComposerLocation = "landing";
      conversationHistory = [];
      conversationInner.innerHTML = "";
      landing.style.display = "flex";
      requestAnimationFrame(() => landing.classList.remove("hidden"));
      topbar.classList.remove("visible");
      conversation.style.display = "none";
      chatComposerZone.style.display = "none";
      landingComposer.textarea.value = "";
      landingComposer.sendBtn.disabled = true;
    }

    newChatBtn.addEventListener("click", resetToLanding);

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function scrollToBottom() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function renderUserMessage(text) {
      const el = document.createElement("div");
      el.className = "msg user";
      el.innerHTML = `
        <div class="msg-head">
          <span class="msg-name">You</span>
          <span class="msg-time">${formatTime()}</span>
        </div>
        <div class="msg-body"></div>
      `;
      el.querySelector(".msg-body").textContent = text;
      conversationInner.appendChild(el);
      scrollToBottom();
    }

    function renderAiMessage() {
      const el = document.createElement("div");
      el.className = "msg val";
      el.innerHTML = `
        <div class="msg-head">
          <span class="msg-name">M Putra Ramadhani - Ai Indonesia</span>
          <span class="msg-time">${formatTime()}</span>
        </div>
        <div class="msg-body"><span class="typing-indicator"><span></span><span></span><span></span></span></div>
        <div class="msg-actions">
          <button class="icon-btn copy-btn">
            <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6"/></svg>
            Copy
          </button>
          <button class="icon-btn regen-btn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Regenerate
          </button>
        </div>
      `;
      conversationInner.appendChild(el);
      scrollToBottom();
      return el;
    }

    function wireMessageActions(el, getText, regenerateFn) {
      const copyBtn = el.querySelector(".copy-btn");
      const regenBtn = el.querySelector(".regen-btn");

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getText());
          const label = copyBtn.childNodes[copyBtn.childNodes.length - 1];
          label.textContent = " Copied";
          setTimeout(() => { label.textContent = " Copy"; }, 1500);
        } catch (e) { /* clipboard unavailable */ }
      });

      regenBtn.addEventListener("click", regenerateFn);
    }

    async function sendMessage(text) {
      enterChatMode();
      renderUserMessage(text);
      conversationHistory.push({ role: "user", content: text });
      await streamAiResponse();
    }

    async function streamAiResponse() {
      isStreaming = true;
      chatComposer.sendBtn.disabled = true;
      landingComposer.sendBtn.disabled = true;

      const el = renderAiMessage();
      const bodyEl = el.querySelector(".msg-body");
      let fullText = "";

      const regenerate = async () => {
        if (isStreaming) return;
        el.remove();
        if (conversationHistory.length && conversationHistory[conversationHistory.length - 1].role === "assistant") {
          conversationHistory.pop();
        }
        await streamAiResponse();
      };

      try {
        const messages = [
          { role: "system", content: VAL_SYSTEM_PROMPT },
          ...conversationHistory
        ];

        if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith("YOUR_")) {
          throw new Error("Please set your OpenRouter API key in the CONFIG object.");
        }

        const response = await fetch(CONFIG.API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${CONFIG.API_KEY}`,
            "HTTP-Referer": window.location.href,
            "X-Title": "M Putra Ramadhani"
          },
          body: JSON.stringify({
            model: CONFIG.MODEL,
            messages,
            temperature: CONFIG.TEMPERATURE,
            max_tokens: CONFIG.MAX_TOKENS,
            stream: true,
            usage: { include: true }
          })
        });

        if (!response.ok) {
          const errBody = await response.text().catch(() => "");
          throw new Error(`API error (${response.status}). ${errBody ? errBody.slice(0, 200) : ""}`);
        }

        bodyEl.innerHTML = `<span class="stream-text"></span><span class="cursor"></span>`;
        const streamTextEl = bodyEl.querySelector(".stream-text");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const payload = trimmed.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const json = JSON.parse(payload);
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                streamTextEl.textContent = fullText;
                scrollToBottom();
              }
              if (json.usage) {
                console.debug("M Putra Ramadhani — token usage:", json.usage);
              }
            } catch (e) { /* ignore partial json */ }
          }
        }

        bodyEl.innerHTML = "";
        bodyEl.textContent = fullText || "…";
        el.classList.add("settled");
        conversationHistory.push({ role: "assistant", content: fullText });
        wireMessageActions(el, () => fullText, regenerate);

      } catch (err) {
        bodyEl.innerHTML = "";
        const errorDiv = document.createElement("div");
        errorDiv.className = "error-msg";
        errorDiv.textContent = err.message || "Something went wrong reaching M Putra Ramadhani - Ai Indonesia. Please try again.";
        bodyEl.appendChild(errorDiv);
        el.classList.add("settled");
        wireMessageActions(el, () => errorDiv.textContent, regenerate);
      } finally {
        isStreaming = false;
        chatComposer.sendBtn.disabled = chatComposer.textarea.value.trim().length === 0;
        landingComposer.sendBtn.disabled = landingComposer.textarea.value.trim().length === 0;
        scrollToBottom();
      }
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
