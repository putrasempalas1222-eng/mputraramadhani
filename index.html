<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>M Putra Ramadhani - Ai Indonesia</title>
    <meta name="description" content="M Putra Ramadhani - Ai Indonesia: Platform kecerdasan buatan Indonesia yang intuitif, ramah, dan adaptif untuk produktivitas cerdas, analisis mendalam, dan percakapan interaktif." />
    <meta name="google-site-verification" content="DXOyQsz_dBAhmNpx1PTZ9yXDakyGwJo9bp9Oi9ynYJs" />
  <link rel="icon" type="image/png" href="/logo-mputraramadhani.png" />
  <link rel="apple-touch-icon" href="/logo-mputraramadhani.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08080a;
      --bg-soft: #0d0d10;
      --surface: #121216;
      --surface-raised: #16161b;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.13);
      --text: #ece7de;
      --text-dim: rgba(236,231,222,0.54);
      --text-faint: rgba(236,231,222,0.3);
      --accent: #cba874;
      --accent-bright: #e0c393;
      --accent-dim: rgba(203,168,116,0.38);
      --accent-soft: rgba(203,168,116,0.09);
      --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --sans: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-soft: 0 20px 60px -24px rgba(0,0,0,0.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse 1100px 560px at 50% -8%, rgba(203,168,116,0.05), transparent 62%),
        radial-gradient(ellipse 900px 700px at 82% 100%, rgba(120,100,160,0.035), transparent 60%),
        radial-gradient(ellipse 700px 600px at 8% 100%, rgba(203,168,116,0.025), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    ::selection { background: rgba(203,168,116,0.22); color: #fff; }
    button { font-family: inherit; cursor: pointer; }
    /* Fokus keyboard selalu terlihat (R-32) */
    :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Top nav ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      flex-shrink: 0;
      z-index: 10;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      border-bottom: 1px solid transparent;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .topbar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      border-bottom-color: var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 18px;
      letter-spacing: 0.015em;
      color: var(--text);
    }
    .brand .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 12px 2px var(--accent-dim);
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      transition: border-color 0.3s var(--ease), color 0.3s var(--ease), background 0.3s var(--ease);
    }
    .new-chat-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
      background: var(--accent-soft);
    }

    /* ---------- Landing ---------- */
    .landing {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease), filter 0.6s var(--ease);
    }
    .landing.hidden {
      opacity: 0;
      transform: translateY(-14px) scale(0.99);
      filter: blur(6px);
      pointer-events: none;
    }

    .landing-inner {
      width: 100%;
      max-width: 620px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .val-mark {
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.005em;
      color: var(--text);
      margin: 0;
      text-shadow: 0 0 40px rgba(203,168,116,0.15);
      animation: rise 1s var(--ease) both;
      animation-delay: 0.04s;
    }

    .val-desc-lead {
      max-width: 540px;
      margin: 8px auto 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-dim);
      letter-spacing: 0.005em;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.08s;
    }

    @media (max-width: 640px) {
      .val-mark { font-size: 28px; }
      .val-desc-lead { font-size: 13.5px; padding: 0 8px; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 24px;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.24s;
    }

    .suggestion-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 17px;
      border-radius: 22px;
      font-size: 13px;
      letter-spacing: 0.005em;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), background 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .suggestion-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent-bright);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .landing .composer-wrap {
      width: 100%;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.32s;
    }

    /* ---------- Conversation ---------- */
    .conversation {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .conversation-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 24px 12px;
    }

    .msg {
      margin-bottom: 18px;
      animation: msgIn 0.55s var(--ease) both;
    }
    .msg:last-child {
      margin-bottom: 4px;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 7px;
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-faint);
    }
    .msg.val .msg-name {
      color: var(--accent);
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    .msg-ai-name-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7.5px;
      color: var(--accent-bright);
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 500;
    }
    .msg-ai-avatar {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(203, 168, 116, 0.25);
      flex-shrink: 0;
    }
    .msg-time {
      font-size: 10.5px;
      color: var(--text-faint);
      opacity: 0.75;
    }

    .msg-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--text);
      letter-spacing: 0.001em;
    }

    /* User Message - Pindah Posisi ke Kanan */
    .msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .msg.user .msg-head {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .msg-time-below { display: block; margin-top: 4px; }

    .msg.user .msg-name {
      color: var(--accent-bright);
    }
    .msg.user .msg-body {
      display: inline-block;
      max-width: 72%;
      text-align: left;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(203, 168, 116, 0.11) 100%);
      border: 1px solid rgba(203, 168, 116, 0.28);
      border-radius: 14px 3px 14px 14px;
      padding: 6px 11px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3), 0 0 8px rgba(203, 168, 116, 0.06);
      backdrop-filter: blur(10px);
      word-break: break-word;
    }

    .msg.user .chat-p { margin: 0; line-height: 1.5; }

    /* Standalone Attachments (Rendered above text bubble) */
    .msg-attachments-standalone {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .msg.user .msg-attachments-standalone {
      align-items: flex-end;
    }
    .msg.val .msg-attachments-standalone {
      align-items: flex-start;
    }
    .msg-standalone-photo-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: inline-flex;
      width: 135px;
      height: 135px;
      max-width: 145px;
      max-height: 145px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
      background: #141418;
    }
    .msg-standalone-photo-wrap:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .msg-standalone-photo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
    }
    .msg-attachment-file-card {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      color: var(--text);
      max-width: 100%;
    }
    .msg-attachment-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    /* Lightbox modal for previewing images */
    .img-lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 5, 8, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: msgIn 0.2s var(--ease);
    }
    .img-lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-strong);
    }
    .img-lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #18181f;
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .img-lightbox-close:hover {
      background: var(--accent);
      color: #08080a;
      transform: scale(1.08);
    }

    .msg-content-flow {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chat-p {
      margin: 4px 0 6px;
      line-height: 1.72;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .chat-p:empty {
      display: none;
    }
    .chat-h1, .chat-h2, .chat-h3, .chat-h4 {
      font-family: var(--serif);
      margin: 14px 0 6px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .chat-h1 {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
    }
    .chat-h2 {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
    }
    .chat-h3 {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--accent-bright);
    }
    .chat-h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .chat-hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(203, 168, 116, 0.35) 15%, rgba(203, 168, 116, 0.35) 85%, transparent);
      margin: 14px 0;
      width: 100%;
    }
    .chat-blockquote {
      margin: 8px 0;
      padding: 8px 16px;
      border-left: 3px solid var(--accent);
      background: rgba(203, 168, 116, 0.06);
      border-radius: 0 8px 8px 0;
      color: var(--text-dim);
      font-style: italic;
    }
    .chat-ul, .chat-ol {
      margin: 6px 0 10px;
      padding-left: 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .chat-li {
      line-height: 1.65;
      color: var(--text);
    }
    .chat-ul .chat-li {
      list-style-type: disc;
    }
    .chat-ol .chat-li {
      list-style-type: decimal;
    }
    .msg-body strong {
      font-weight: 600;
      color: #ffffff;
    }
    .msg-body em {
      font-style: italic;
      color: var(--text-dim);
    }

    /* ---------- Dedicated Code Block Column (M Putra Ramadhani Theme) ---------- */
    .code-block-wrapper {
      margin: 14px 0;
      background: #090a0e;
      border: 1px solid rgba(203, 168, 116, 0.22);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
      white-space: normal;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .code-block-wrapper:hover {
      border-color: rgba(203, 168, 116, 0.4);
      box-shadow: 0 14px 36px -6px rgba(0, 0, 0, 0.82), 0 0 0 1px rgba(203, 168, 116, 0.15);
    }
    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: rgba(20, 21, 28, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      user-select: none;
    }
    .code-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .code-lang-icon {
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      opacity: 0.9;
    }
    .code-lang-name {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    /* Tombol Copy Khusus di Atas Kanan Sesuai Permintaan */
    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(203, 168, 116, 0.08);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      padding: 4.5px 11px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      line-height: 1;
    }
    .code-copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #14120d;
      transform: translateY(-0.5px);
      box-shadow: 0 2px 10px rgba(203, 168, 116, 0.35);
    }
    .code-copy-btn.copied {
      background: rgba(203, 168, 116, 0.22);
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .code-copy-btn svg {
      flex-shrink: 0;
    }
    .code-block-pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: transparent;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.68;
      color: #e6edf3;
      white-space: pre;
    }
    .code-block-pre::-webkit-scrollbar {
      height: 6px;
    }
    .code-block-pre::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    .code-block-pre::-webkit-scrollbar-thumb {
      background: rgba(203, 168, 116, 0.25);
      border-radius: 3px;
    }
    .code-block-pre::-webkit-scrollbar-thumb:hover {
      background: rgba(203, 168, 116, 0.45);
    }
    .code-block-code {
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      padding: 0;
      border: 0;
      color: inherit;
    }
    .inline-code {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 5px;
      background: rgba(203, 168, 116, 0.12);
      border: 1px solid rgba(203, 168, 116, 0.24);
      color: var(--accent-bright);
      white-space: break-spaces;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 2px;
      opacity: 0.95;
      transition: opacity 0.25s var(--ease);
    }
    .msg.val:hover .msg-actions,
    .msg.val.settled .msg-actions { opacity: 1; }

    .msg-version-nav {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      font-size: 11.5px;
      color: var(--text-dim);
      user-select: none;
      height: 26px;
      box-sizing: border-box;
    }
    .version-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
      height: 100%;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .version-nav-btn:hover:not(:disabled) {
      color: var(--accent-bright);
      background: rgba(203, 168, 116, 0.15);
    }
    .version-nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .version-nav-label {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0 4px;
      color: var(--text);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      color: #ded9cd;
      font-family: var(--serif);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6.5px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.22s var(--ease);
      user-select: none;
    }
    .icon-btn:hover {
      background: rgba(203, 168, 116, 0.08);
      border-color: var(--accent-bright);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .icon-btn:active {
      transform: translateY(0);
    }
    .icon-btn.copied {
      background: transparent;
      border-color: rgba(72, 199, 142, 0.45);
      color: #5edb9c;
    }
    .icon-btn svg {
      width: 13.5px;
      height: 13.5px;
      color: var(--accent-bright);
      stroke-width: 2px;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease), color 0.2s var(--ease);
    }
    .icon-btn.copied svg {
      color: #5edb9c;
    }
    .icon-btn.regen-btn:hover svg {
      transform: rotate(-45deg);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: var(--accent-bright);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: smoothCursorPulse 0.85s ease-in-out infinite alternate;
    }
    @keyframes smoothCursorPulse {
      0% { opacity: 0.2; transform: scaleY(0.9); }
      100% { opacity: 1; transform: scaleY(1); }
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      margin-top: 4px;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .typing-indicator span {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 7px rgba(203, 168, 116, 0.45);
      animation: typingSmoothWave 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform, opacity, box-shadow;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.22s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.44s; }
    @keyframes typingSmoothWave {
      0%, 100% {
        transform: translateY(0) scale(0.82);
        opacity: 0.32;
        box-shadow: 0 0 3px rgba(203, 168, 116, 0.2);
      }
      50% {
        transform: translateY(-5px) scale(1.18);
        opacity: 1;
        box-shadow: 0 0 11px rgba(203, 168, 116, 0.75);
      }
    }

    .error-msg {
      font-size: 13px;
      line-height: 1.6;
      color: #d3a48f;
      background: rgba(196,120,90,0.07);
      border: 1px solid rgba(196,120,90,0.18);
      padding: 13px 17px;
      border-radius: 12px;
      margin-top: 6px;
    }

    /* ---------- Composer ---------- */
    .composer-zone {
      flex-shrink: 0;
      padding: 6px 24px 16px;
      display: flex;
      justify-content: center;
    }
    .composer-wrap { max-width: 680px; width: 100%; }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, var(--surface-raised), var(--surface));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 8px 10px 8px 12px;
      min-height: 52px;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
      position: relative;
      box-sizing: border-box;
    }
    .composer:focus-within {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3.5px var(--accent-soft), var(--shadow-soft);
    }

    /* Model selector on the left inside composer (Compact & Space-efficient) */
    .composer-model-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin: 0;
      align-self: center;
      height: 30px;
    }
    .composer-model-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-strong);
      border-radius: 15px;
      height: 30px;
      padding: 0 9px;
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s var(--ease);
      max-width: 140px;
      box-sizing: border-box;
      line-height: 1;
      margin: 0;
    }
    .composer-model-btn:hover, .composer-model-btn.open {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
      color: var(--accent-bright);
    }
    .composer-model-spark {
      color: var(--accent-bright);
      font-size: 10.5px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    .composer-model-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 95px;
      font-size: 11px;
      letter-spacing: -0.01em;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-free-badge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 2px 4.5px;
      border-radius: 4px;
      background: rgba(203, 168, 116, 0.18);
      color: var(--accent-bright);
      border: 1px solid rgba(203, 168, 116, 0.32);
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-arrow {
      color: var(--text-faint);
      transition: transform 0.2s var(--ease);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-btn.open .composer-model-arrow {
      transform: rotate(180deg);
      color: var(--accent-bright);
    }
    /* Popover = satu-satunya permukaan glass di app (R-10); emas hanya sebagai aksen terpilih (R-01) */
    .composer-model-popover {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 0;
      width: 304px;
      max-width: calc(100vw - 36px);
      z-index: 100;
      background: rgba(19, 19, 24, 0.92);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      box-shadow: 0 24px 56px -16px rgba(0, 0, 0, 0.85);
      padding: 10px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: msgIn 0.2s var(--ease);
    }
    .model-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 8px;
    }
    .model-selector-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .composer textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 22px;
      max-height: 200px;
      padding: 7px 0;
      margin: 0;
      letter-spacing: 0.001em;
      align-self: center;
      box-sizing: border-box;
      display: block;
      overflow-x: hidden;
    }
    .composer textarea::placeholder { color: var(--text-faint); }
    .attachment-input { display: none; }
    .attachment-menu-wrap { position: relative; flex: 0 0 auto; }
    .attachment-btn { width: 30px; height: 30px; padding: 0; border: 0; background: transparent; color: var(--text-faint); display: grid; place-items: center; flex: 0 0 auto; font-size: 25px; font-weight: 300; line-height: 1; }
    .attachment-btn:hover:not(:disabled) { color: var(--accent-bright); }
    .attachment-btn:disabled { opacity: .35; cursor: default; }
    .attachment-menu { position: absolute; bottom: calc(100% + 9px); left: -4px; min-width: 104px; padding: 5px; display: grid; gap: 2px; border: 1px solid var(--border-strong); border-radius: 10px; background: #17171d; box-shadow: 0 14px 34px rgba(0,0,0,.55); z-index: 120; }
    .attachment-menu button { border: 0; border-radius: 7px; padding: 8px 10px; background: transparent; color: var(--text-dim); text-align: left; font: inherit; font-size: 12px; }
    .attachment-menu button:hover { background: var(--accent-soft); color: var(--accent-bright); }
    .composer-attachments { width: min(100%, 680px); display: flex; gap: 7px; flex-wrap: wrap; margin: 0 auto 8px; }
    .composer-attachment { height: 42px; max-width: 190px; padding: 4px 6px 4px 4px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); color: var(--text-dim); font-size: 11px; overflow: hidden; }
    .composer-attachment img { width: 32px; height: 32px; border-radius: 5px; object-fit: cover; }
    .composer-attachment span:not(.attachment-file-icon) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-file-icon { font-size: 8px; padding: 7px 4px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-bright); font-weight: 700; }
    .composer-attachment button { margin-left: auto; border: 0; background: none; color: var(--text-faint); font-size: 17px; line-height: 1; padding: 2px; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #14120d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease), opacity 0.25s var(--ease), background 0.25s var(--ease);
      align-self: center;
      margin: 0;
      padding: 0;
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); background: var(--accent-bright); }
    .send-btn:active:not(:disabled) { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.28; cursor: default; }
    .send-btn svg { width: 15px; height: 15px; }

    .composer-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    /* ---------- Authentication ---------- */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 22px; background: rgba(5,5,7,0.72); backdrop-filter: blur(12px);
    }
    .auth-modal {
      width: min(100%, 420px); background: linear-gradient(155deg, var(--surface-raised), var(--surface));
      border: 1px solid var(--border-strong); border-radius: 20px; padding: 30px; box-shadow: 0 28px 80px rgba(0,0,0,0.55);
      animation: msgIn .45s var(--ease) both;
    }
    .auth-title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 27px; color: var(--text); }
    .auth-subtitle { margin: 8px 0 24px; color: var(--text-dim); font-size: 13px; line-height: 1.55; }
    .auth-form { display: grid; gap: 12px; }
    .auth-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .auth-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; outline: none; background: rgba(0,0,0,0.14); color: var(--text); padding: 12px 13px; font: inherit; font-size: 13px; transition: border-color .25s var(--ease), box-shadow .25s var(--ease); }
    .auth-input::placeholder { color: var(--text-faint); }
    .auth-input:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-submit, .google-btn { width: 100%; border-radius: 10px; padding: 12px 15px; font: inherit; font-size: 13px; transition: transform .2s var(--ease), opacity .2s var(--ease), background .2s var(--ease); }
    .auth-submit { border: none; background: var(--accent); color: #14120d; margin-top: 4px; }
    .auth-submit:hover:not(:disabled) { background: var(--accent-bright); transform: translateY(-1px); }
    .google-btn { border: 1px solid var(--border); background: transparent; color: var(--text-dim); }
    .google-btn:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--text); background: var(--accent-soft); }
    .auth-submit:disabled, .google-btn:disabled { opacity: .5; cursor: default; }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--text-faint); font-size: 11px; }
    .auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }
    .auth-toggle { margin: 20px 0 0; font-size: 12px; color: var(--text-dim); text-align: center; }
    .auth-link { padding: 0; border: 0; background: none; color: var(--accent-bright); font: inherit; font-size: inherit; cursor: pointer; }
    .auth-error { margin: 0; color: #d3a48f; font-size: 12px; line-height: 1.45; }

    /* ---------- Chat history ---------- */
    .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 250px; padding: 18px 13px; background: rgba(10,10,13,.94); border-right: 1px solid var(--border); display: flex; flex-direction: column; backdrop-filter: blur(14px); overflow: hidden; }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px 14px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: default;
      user-select: none;
    }
    .sidebar-brand-img {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(203, 168, 116, 0.25);
      flex-shrink: 0;
    }
    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .sidebar-brand-title {
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .sidebar-brand-sub {
      font-size: 10px;
      color: var(--accent-bright);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
      line-height: 1.2;
    }
    .sidebar-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .sidebar-tools button {
      background: none;
      border: 0;
      color: var(--text-faint);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .sidebar-tools button:hover {
      color: var(--text);
      background: var(--accent-soft);
    }
    .sidebar-tools button svg {
      width: 17px;
      height: 17px;
    }
    .sidebar-new {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease);
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .sidebar-new:hover {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
      color: var(--accent-bright);
    }
    .sidebar-new:active {
      transform: scale(0.99);
    }
    .sidebar-new svg {
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    .sidebar-new-label {
      font-weight: 500;
    }
    /* ---------- Suara Putra (mode obrolan suara) ---------- */
    /* Alasan (R-31): satu aksen emas dari identitas situs; pulse hanya saat mic aktif sebagai umpan balik status (R-19), tanpa glow */
    .sidebar-voice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease);
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .sidebar-voice:hover {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
      color: var(--text);
    }
    .sidebar-voice:active { transform: scale(0.99); }
    .sidebar-voice svg { color: var(--accent-bright); flex-shrink: 0; }
    .voice-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 24px 20px;
      overflow-y: auto;
    }
    .voice-top {

    .voice-top-title { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--text); }
    .voice-top-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
    .voice-plan-pill {
      display: inline-flex;
      align-items: center;

      font-size: 11px;
      padding: 3px 9px;

      line-height: 1.2;
      border: 1px solid transparent;

    }
    .voice-plan-pill.plus {

    }
    .voice-plan-pill.free {
      background: rgba(255, 255, 255, 0.05);

      color: var(--text-dim);
      cursor: pointer;
      transition: all .2s var(--ease);
    }
    .voice-plan-pill.free:hover {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
      color: var(--accent-bright);
    }
    .voice-plan-pill.free.limit-reached {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.4);

    }
    .voice-pill-upgrade-arrow {
      color: var(--accent-bright);
      font-weight: 700;
      margin-left: 2px;
    }
    .voice-limit-card {
      width: min(100%, 420px);
      background: linear-gradient(155deg, var(--surface-raised), var(--surface));
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 30px;
      margin: 12px auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;

    }
    .voice-limit-icon-wrap {

      height: 44px;

      background: rgba(214, 122, 114, 0.12);
      border: 1px solid rgba(214, 122, 114, 0.28);

      display: grid;
      place-items: center;
    }
    .voice-limit-title {
      font-size: 18px;
      font-weight: 400;
      color: var(--text);
      margin: 0;
    }
    .voice-limit-desc {
      max-width: 365px;
      font-size: 13.5px;
      color: var(--text-dim);
      margin: 0 0 4px;
      line-height: 1.55;
    }
    .voice-limit-desc strong {
      color: var(--accent-bright);
    }
    .voice-upgrade-cta {
      background: var(--accent-bright);
      color: #0d0d0f;
      font-weight: 700;
      border: none;
      padding: 12px 15px;
      border-radius: 10px;
      box-shadow: none;
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s var(--ease);
    }
    .voice-upgrade-cta:hover {
      background: #dfb980;
      transform: translateY(-1px);
    }
    .voice-top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .voice-gender-toggle {
      display: inline-flex;
      align-items: center;

    }

    }
    .voice-gender-btn:hover { color: var(--text); }
    .voice-gender-btn.active {
      background: var(--accent-soft);
      color: var(--accent-bright);
      border-color: var(--accent-dim);
      font-weight: 600;
    }
    .voice-gender-btn span { font-size: 11px; opacity: 0.85; }
    .voice-icon-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .voice-icon-btn:hover { color: var(--accent-bright); border-color: var(--accent-dim); background: var(--accent-soft); }
    .voice-icon-btn[aria-pressed="true"] { color: var(--accent-bright); border-color: var(--accent-dim); background: var(--accent-soft); }
    .voice-stage {
      flex: 1;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px 0;
    }
    .voice-orb {
      width: 88px; height: 88px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent-soft);
      border: 1px solid var(--accent-dim);
      color: var(--accent-bright);
      position: relative;
    }
    .voice-orb svg { width: 30px; height: 30px; }
    .voice-orb.listening { cursor: pointer; }
    .voice-orb.listening::before,
    .voice-orb.listening::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--accent-dim);
      animation: voicePulse 1.9s var(--ease) infinite;
      pointer-events: none;
    }
    .voice-orb.listening::after { animation-delay: 0.95s; }
    .voice-orb.paused {
      border-color: var(--accent-dim);
      background: rgba(203, 168, 116, 0.08);
      color: #dca03c;
      cursor: pointer;
    }
    .voice-orb.speaking {
      background: radial-gradient(circle at 35% 35%, rgba(240, 206, 154, 0.28), rgba(203, 168, 116, 0.12));

      box-shadow: 0 0 32px rgba(203, 168, 116, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);

    @keyframes voiceTalkBob {

    .sidebar-header .sidebar-brand { flex: 1; min-width: 0; padding: 0; font-family: var(--serif); font-size: 16px; font-weight: 500; line-height: 1.35; letter-spacing: 0.015em; color: var(--text); }

    .sidebar-toggle { display: grid; place-items: center; position: fixed; z-index: 31; top: 18px; left: 16px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--text-dim); font-size: 21px; }

    .header-name { display: flex; position: fixed; top: 22px; left: 64px; z-index: 30; max-width: calc(100vw - 160px); flex-direction: column; line-height: 1.12; color: var(--text); font-family: var(--serif); font-size: 16px; pointer-events: none; }
    .header-name small { align-self: flex-start; margin-top: 3px; color: var(--accent-bright); font-family: var(--sans); font-size: 8px; font-weight: 700; letter-spacing: .13em; }

    /* ---------- Model picker (popover composer) ---------- */
    /* Alasan (R-31): satu aksen emas pada elemen terpilih (R-01), tanpa glow (R-13),
       badge fungsional maks 2 per baris (R-09), teks sekunder memakai text-dim agar lolos WCAG AA (R-25). */
    .model-tags-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .model-plan-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 1.5px 5.5px;
      border-radius: 5px;
      text-transform: uppercase;
      line-height: 1.3;
      white-space: nowrap;
    }
    .model-plan-tag.free {
      background: rgba(80, 200, 120, 0.12);
      color: #5fd08a;
      border: 1px solid rgba(80, 200, 120, 0.28);
    }
    .model-plan-tag.plus {
      background: var(--accent-soft);
      color: var(--accent-bright);
      border: 1px solid var(--accent-dim);
    }
    .model-item.locked { opacity: 0.7; }
    .model-item.locked:hover { opacity: 1; background: var(--accent-soft); }
    .model-lock-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      opacity: 0.9;
      margin-left: 6px;
      margin-top: 3px;
      flex-shrink: 0;
    }
    .model-search-box { position: relative; margin-bottom: 7px; }
    .model-search-box input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 30px 7px 31px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .2s var(--ease), background .2s var(--ease);
    }
    .model-search-box input:focus { border-color: var(--accent-dim); background: rgba(0,0,0,0.4); }
    .model-search-box > svg {
      position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
      width: 13px; height: 13px; color: var(--text-faint); pointer-events: none;
    }
    .model-search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; padding: 0;
      display: grid; place-items: center;
      border: 0; border-radius: 6px; background: transparent; color: var(--text-dim);
    }
    .model-search-clear:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .model-search-clear svg { width: 11px; height: 11px; }
    .model-list-scroll {
      overflow-y: auto; flex: 1;
      display: flex; flex-direction: column; gap: 2px;
      padding-right: 2px;
      max-height: min(272px, 44vh);
      overscroll-behavior: contain;
    }
    .model-group-title {
      font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-dim); padding: 6px 8px 3px; font-weight: 700;
    }
    .model-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 9px; border-radius: 9px;
      background: transparent; border: 1px solid transparent;
      color: var(--text); text-align: left; cursor: pointer;
      transition: background .15s var(--ease), border-color .15s var(--ease);
      width: 100%;
    }
    .model-item:hover { background: var(--accent-soft); }
    .model-item.selected { background: rgba(203,168,116,0.13); border-color: var(--accent-dim); }
    .model-item-info { flex: 1; min-width: 0; }
    .model-item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
    .model-item-name { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-tag { font-size: 9.5px; padding: 1.5px 5px; border-radius: 5px; background: rgba(255,255,255,0.06); color: var(--text-dim); white-space: nowrap; }
    .model-item-desc {
      font-size: 11px; color: var(--text-dim); line-height: 1.4; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .model-item-footer { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-dim); }
    .model-item-empty {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 20px 12px; text-align: center; color: var(--text-dim);
    }
    .model-item-empty p { margin: 0; font-size: 12px; }
    .model-empty-btn {
      margin-top: 2px; padding: 6px 14px; font-size: 11.5px;
      border-radius: 8px; border: 1px solid var(--border-strong);
      background: transparent; color: var(--text-dim);
      transition: border-color .2s var(--ease), color .2s var(--ease);
    }
    .model-empty-btn:hover { border-color: var(--accent-dim); color: var(--accent-bright); }
    .model-dropdown-footer {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .model-footer-count { color: var(--text-dim); font-size: 10px; }
    .model-sync-btn {
      background: none; border: 0; color: var(--text-dim); font-size: 10.5px;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 6px; margin-left: -6px;
      cursor: pointer; border-radius: 6px; transition: color .2s var(--ease);
    }
    .model-sync-btn:hover:not(:disabled) { color: var(--accent-bright); }
    .model-sync-btn:disabled { opacity: 0.6; cursor: default; }
    .model-sync-icon { display: inline-flex; }
    .model-sync-btn.busy .model-sync-icon { animation: modelSyncSpin 0.9s linear infinite; }
    @keyframes modelSyncSpin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .app-shell { --drawer-width: min(280px, calc(100vw - 56px)); }
      .drawer-open > .app-main { margin-left: 0; }

      .composer textarea {

      }

        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    }

    @media (max-width: 768px), (hover: none) and (pointer: coarse) {
      .composer textarea {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .composer textarea::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {

      .composer-model-popover {
        left: auto;
        right: 0;
        width: min(304px, calc(100vw - 28px));
        max-width: calc(100vw - 28px);
        box-sizing: border-box;
      }
      .model-list-scroll { max-height: min(272px, 44vh); overscroll-behavior: contain; }
      .composer-model-btn { max-width: 90px; padding: 0 7px; }
      .composer-model-name { max-width: 54px; }
      .msg-attachments-standalone { max-width: 86%; }
      .msg-standalone-photo-wrap {
        width: 120px;
        height: 120px;
        max-width: 125px;
        max-height: 125px;
        border-radius: 16px;
      }
      .msg-standalone-photo {
        border-radius: 16px;
      }
      .img-lightbox-close { top: 12px; right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <div class="topbar" id="topbar">
      <div class="brand"><span class="dot"></span>M Putra Ramadhani</div>
      <button class="new-chat-btn" id="newChatBtn">New chat</button>
    </div>

    <!-- Landing -->
    <div class="landing" id="landing">
      <div class="landing-inner">
        <h1 class="val-mark">M Putra Ramadhani</h1>
        <p class="val-question">What's on your mind?</p>
        <p class="val-sub">I'm here. Talk to me.</p>

        <div class="suggestions">
          <button class="suggestion-btn" data-prompt="Tell me about your day">Tell me about your day</button>
          <button class="suggestion-btn" data-prompt="I need someone to talk to">I need someone to talk to</button>
          <button class="suggestion-btn" data-prompt="Let's brainstorm">Let's brainstorm</button>
          <button class="suggestion-btn" data-prompt="Ask me anything">Ask me anything</button>
        </div>

        <div class="composer-wrap" id="landingComposerWrap"></div>
      </div>
    </div>

    <!-- Conversation -->
    <div class="conversation" id="conversation" style="display:none;">
      <div class="conversation-inner" id="conversationInner"></div>
    </div>

    <!-- Composer (chat mode) -->
    <div class="composer-zone" id="chatComposerZone" style="display:none;">
      <div class="composer-wrap" id="chatComposerWrap"></div>
    </div>
  </div>

  <!-- Composer template -->
  <template id="composerTemplate">
    <div class="composer">
      <textarea rows="1" placeholder="Message M Putra Ramadhani…" id="composerInput"></textarea>
      <button class="send-btn" id="composerSendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
  </template>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
