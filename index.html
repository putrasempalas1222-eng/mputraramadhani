<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>M Putra Ramadhani - Ai Indonesia</title>
    <meta name="description" content="M Putra Ramadhani - Ai Indonesia: Platform kecerdasan buatan Indonesia yang intuitif, ramah, dan adaptif untuk produktivitas cerdas, analisis mendalam, dan percakapan interaktif." />
    <meta name="google-site-verification" content="DXOyQsz_dBAhmNpx1PTZ9yXDakyGwJo9bp9Oi9ynYJs" />
  <link rel="icon" type="image/png" href="/logo-mputraramadhani.png" />
  <link rel="apple-touch-icon" href="/logo-mputraramadhani.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111113;
      --bg-soft: #161618;
      --surface: #161618;
      --surface-raised: #1c1c20;
      --border: #28282b;
      --border-strong: #38383c;
      --text: #ece7de;
      --text-dim: rgba(236,231,222,0.64);
      --text-faint: rgba(236,231,222,0.36);
      --accent: #cba874;
      --accent-bright: #e0c393;
      --accent-dim: rgba(203,168,116,0.38);
      --accent-soft: rgba(203,168,116,0.09);
      --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --sans: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Newsreader", "Times New Roman", serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-soft: 0 20px 60px -24px rgba(0,0,0,0.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: #111113;
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    ::selection { background: rgba(255, 255, 255, 0.18); color: #fff; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      outline: none;
      color: inherit;
    }
    /* Fokus keyboard selalu terlihat (R-32) */
    :focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ---------- Top nav ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      flex-shrink: 0;
      z-index: 10;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      border-bottom: 1px solid transparent;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .topbar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      border-bottom-color: var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 18px;
      letter-spacing: 0.015em;
      color: var(--text);
    }
    .brand .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 12px 2px var(--accent-dim);
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      transition: border-color 0.3s var(--ease), color 0.3s var(--ease), background 0.3s var(--ease);
    }
    .new-chat-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
      background: var(--accent-soft);
    }

    /* ---------- Landing ---------- */
    .landing {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease), filter 0.6s var(--ease);
    }
    .landing.hidden {
      opacity: 0;
      transform: translateY(-14px) scale(0.99);
      filter: blur(6px);
      pointer-events: none;
    }

    .landing-inner {
      width: 100%;
      max-width: 620px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .val-mark {
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 0.005em;
      color: var(--text);
      margin: 0;
      text-shadow: 0 0 40px rgba(203,168,116,0.15);
      animation: rise 1s var(--ease) both;
      animation-delay: 0.04s;
    }

    .val-desc-lead {
      max-width: 540px;
      margin: 8px auto 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-dim);
      letter-spacing: 0.005em;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.08s;
    }

    @media (max-width: 640px) {
      .val-mark { font-size: 28px; }
      .val-desc-lead { font-size: 13.5px; padding: 0 8px; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 24px;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.24s;
    }

    .suggestion-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 17px;
      border-radius: 22px;
      font-size: 13px;
      letter-spacing: 0.005em;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), background 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .suggestion-btn:hover {
      border-color: var(--accent-dim);
      color: var(--accent-bright);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .landing .composer-wrap {
      width: 100%;
      animation: rise 1s var(--ease) both;
      animation-delay: 0.32s;
    }

    /* ---------- Conversation ---------- */
    .conversation {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .conversation-inner {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 12px;
      box-sizing: border-box;
    }

    .msg {
      margin-bottom: 18px;
      animation: msgIn 0.55s var(--ease) both;
    }
    .msg:last-child {
      margin-bottom: 4px;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 7px;
    }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-faint);
    }
    .msg.val .msg-name {
      color: var(--accent);
      font-family: var(--serif);
      font-weight: 400;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    .msg-ai-name-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7.5px;
      color: var(--accent-bright);
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 500;
    }
    .msg-ai-avatar {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(203, 168, 116, 0.25);
      flex-shrink: 0;
    }
    .msg-time {
      font-size: 10.5px;
      color: var(--text-faint);
      opacity: 0.75;
    }

    .msg-body {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--text);
      letter-spacing: 0.001em;
    }

    /* User Message - Pindah Posisi ke Kanan */
    .msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }
    .msg.user .msg-head {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .msg-time-below { display: block; margin-top: 4px; }

    .msg.user .msg-name {
      color: var(--accent-bright);
    }
    .msg.user .msg-body {
      display: inline-block;
      max-width: 72%;
      text-align: left;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(203, 168, 116, 0.11) 100%);
      border: 1px solid rgba(203, 168, 116, 0.28);
      border-radius: 14px 3px 14px 14px;
      padding: 6px 11px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.3), 0 0 8px rgba(203, 168, 116, 0.06);
      backdrop-filter: blur(10px);
      word-break: break-word;
    }

    .msg.user .chat-p { margin: 0; line-height: 1.5; }

    /* Standalone Attachments (Rendered above text bubble) */
    .msg-attachments-standalone {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .msg.user .msg-attachments-standalone {
      align-items: flex-end;
    }
    .msg.val .msg-attachments-standalone {
      align-items: flex-start;
    }
    .msg-standalone-photo-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: inline-flex;
      width: 135px;
      height: 135px;
      max-width: 145px;
      max-height: 145px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
      background: #141418;
    }
    .msg-standalone-photo-wrap:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .msg-standalone-photo {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
    }
    .msg-attachment-file-card {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      color: var(--text);
      max-width: 100%;
    }
    .msg-attachment-file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    /* Lightbox modal for previewing images */
    .img-lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 5, 8, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: msgIn 0.2s var(--ease);
    }
    .img-lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-strong);
    }
    .img-lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #18181f;
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .img-lightbox-close:hover {
      background: var(--accent);
      color: #08080a;
      transform: scale(1.08);
    }

    .msg-content-flow {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chat-p {
      margin: 4px 0 6px;
      line-height: 1.65;
      color: var(--text);
      font-size: 15.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .chat-p:empty {
      display: none;
    }
    .chat-h1, .chat-h2, .chat-h3, .chat-h4 {
      font-family: var(--serif);
      margin: 12px 0 5px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    .chat-h1 {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
    }
    .chat-h2 {
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
    }
    .chat-h3 {
      font-size: 17.5px;
      font-weight: 600;
      color: #ffffff;
    }
    .chat-h4 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }
    .chat-hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(203, 168, 116, 0.25) 15%, rgba(203, 168, 116, 0.25) 85%, transparent);
      margin: 8px 0;
      width: 100%;
    }
    .chat-blockquote {
      margin: 6px 0;
      padding: 6px 14px;
      border-left: 3px solid var(--accent);
      background: rgba(203, 168, 116, 0.06);
      border-radius: 0 6px 6px 0;
      color: var(--text);
      font-style: italic;
    }
    .chat-ul, .chat-ol {
      margin: 4px 0 6px;
      padding-left: 20px;
      display: block;
    }
    .chat-li {
      line-height: 1.62;
      color: var(--text);
      margin-bottom: 4px;
      font-size: 15.5px;
    }
    .chat-ul .chat-li {
      display: list-item;
      list-style-type: disc;
    }
    .chat-ol .chat-li {
      display: list-item;
      list-style-type: decimal;
    }
    .chat-li-title {
      display: inline;
      font-weight: 600;
      color: #ffffff;
      font-size: 15.5px;
    }
    .chat-li-desc {
      margin: 3px 0 5px 0;
      line-height: 1.62;
      color: var(--text);
      font-size: 15px;
    }
    .chat-sub-ul {
      margin: 3px 0 5px 0;
      padding-left: 18px;
      list-style-type: disc;
    }
    .chat-sub-li {
      line-height: 1.58;
      color: var(--text);
      margin-bottom: 3px;
      font-size: 15px;
    }
    .msg-body strong {
      font-weight: 600;
      color: #ffffff;
    }
    .msg-body em {
      font-style: italic;
      color: inherit;
    }
    .chat-academic-title {
      margin: 10px 0 14px;
      color: #ffffff;
      font-size: clamp(20px, 2.4vw, 29px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: .01em;
      text-transform: none;
    }

    /* ---------- Dedicated Code Block Column (M Putra Ramadhani Theme) ---------- */
    .code-block-wrapper {
      margin: 14px 0;
      background: #090a0e;
      border: 1px solid rgba(203, 168, 116, 0.22);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
      white-space: normal;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .code-block-wrapper:hover {
      border-color: rgba(203, 168, 116, 0.4);
      box-shadow: 0 14px 36px -6px rgba(0, 0, 0, 0.82), 0 0 0 1px rgba(203, 168, 116, 0.15);
    }
    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: rgba(20, 21, 28, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      user-select: none;
    }
    .code-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .code-lang-icon {
      color: var(--accent-bright);
      display: flex;
      align-items: center;
      opacity: 0.9;
    }
    .code-lang-name {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    /* Tombol Copy Khusus di Atas Kanan Sesuai Permintaan */
    .code-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(203, 168, 116, 0.08);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      padding: 4.5px 11px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      line-height: 1;
    }
    .code-copy-btn:hover {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #14120d;
      transform: translateY(-0.5px);
      box-shadow: 0 2px 10px rgba(203, 168, 116, 0.35);
    }
    .code-copy-btn.copied {
      background: rgba(203, 168, 116, 0.22);
      border-color: var(--accent);
      color: var(--accent-bright);
    }
    .code-copy-btn svg {
      flex-shrink: 0;
    }
    .code-block-pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: transparent;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.68;
      color: #e6edf3;
      white-space: pre;
    }
    .code-block-pre::-webkit-scrollbar {
      height: 6px;
    }
    .code-block-pre::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
    }
    .code-block-pre::-webkit-scrollbar-thumb {
      background: rgba(203, 168, 116, 0.25);
      border-radius: 3px;
    }
    .code-block-pre::-webkit-scrollbar-thumb:hover {
      background: rgba(203, 168, 116, 0.45);
    }
    .code-block-code {
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      padding: 0;
      border: 0;
      color: inherit;
    }
    .inline-code {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 12.5px;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 5px;
      background: rgba(203, 168, 116, 0.12);
      border: 1px solid rgba(203, 168, 116, 0.24);
      color: var(--accent-bright);
      white-space: break-spaces;
    }

    /* ---------- Dedicated Formula / Math Block Column ---------- */
    .math-block-wrapper {
      margin: 14px 0;
      background: #090b10;
      border: 1px solid rgba(203, 168, 116, 0.32);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px -6px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(203, 168, 116, 0.1);
      white-space: normal;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .math-block-wrapper:hover {
      border-color: rgba(203, 168, 116, 0.5);
      box-shadow: 0 14px 36px -6px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(203, 168, 116, 0.2);
    }
    .math-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(20, 22, 30, 0.92);
      border-bottom: 1px solid rgba(203, 168, 116, 0.16);
      user-select: none;
    }
    .math-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .math-icon {
      color: var(--accent-bright, #ddbd85);
      display: flex;
      align-items: center;
    }
    .math-badge-title {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-bright, #ddbd85);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .math-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(203, 168, 116, 0.08);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      padding: 4px 10px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      line-height: 1;
    }
    .math-copy-btn:hover {
      background: var(--accent, #cba874);
      border-color: var(--accent-bright, #ddbd85);
      color: #14120d;
      transform: translateY(-0.5px);
      box-shadow: 0 2px 10px rgba(203, 168, 116, 0.35);
    }
    .math-copy-btn.copied {
      background: rgba(203, 168, 116, 0.22);
      border-color: var(--accent, #cba874);
      color: var(--accent-bright, #ddbd85);
    }
    .math-block-body {
      padding: 16px 20px;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, rgba(203, 168, 116, 0.04) 0%, transparent 80%);
    }
    .katex-display-wrapper {
      max-width: 100%;
      font-size: 16px;
      color: #f1f3f7;
    }
    .katex-display-wrapper .katex-display {
      margin: 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }
    .katex-inline-wrapper {
      color: #f5f5f7;
      font-size: 1.05em;
      padding: 0 2px;
      display: inline-block;
    }
    .math-raw-fallback {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: #e4e4e7;
      margin: 0;
      white-space: pre-wrap;
    }

    /* ---------- Dedicated Academic Table Block ---------- */
    .chat-table-wrapper {
      margin: 14px 0;
      background: #090a0e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.7);
      white-space: normal;
      transition: border-color 0.2s var(--ease);
    }
    .chat-table-wrapper:hover {
      border-color: rgba(203, 168, 116, 0.35);
    }
    .chat-table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(20, 21, 28, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
    }
    .chat-table-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .chat-table-icon {
      color: var(--accent-bright, #ddbd85);
      display: flex;
      align-items: center;
    }
    .chat-table-title {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-bright, #ddbd85);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .chat-table-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 7px;
      padding: 4px 10px;
      color: var(--text-dim);
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      line-height: 1;
    }
    .chat-table-copy-btn:hover {
      background: rgba(203, 168, 116, 0.15);
      border-color: var(--accent-bright, #ddbd85);
      color: var(--accent-bright, #ddbd85);
    }
    .chat-table-copy-btn.copied {
      background: rgba(203, 168, 116, 0.22);
      border-color: var(--accent, #cba874);
      color: var(--accent-bright, #ddbd85);
    }
    .chat-table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .academic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.55;
      color: #e4e4e7;
      text-align: left;
    }
    .academic-table thead tr {
      background: rgba(255, 255, 255, 0.035);
      border-bottom: 2px solid rgba(203, 168, 116, 0.38);
    }
    .academic-table th {
      padding: 9px 14px;
      font-weight: 600;
      color: var(--accent-bright, #ddbd85);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .academic-table td {
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .academic-table tbody tr:last-child td {
      border-bottom: none;
    }
    .academic-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    /* ---------- Dedicated Elicitations / Next Action Block ---------- */
    .elicitation-block {
      margin: 16px 0;
      background: #0d0f16;
      border: 1px solid rgba(203, 168, 116, 0.32);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(203, 168, 116, 0.08);
      white-space: normal;
    }
    .elicitation-header {
      margin-bottom: 12px;
    }
    .elicitation-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(203, 168, 116, 0.12);
      border: 1px solid rgba(203, 168, 116, 0.28);
      border-radius: 6px;
      padding: 3.5px 9px;
      color: var(--accent-bright, #ddbd85);
      font-family: var(--serif);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .elicitation-message {
      margin: 4px 0 0;
      font-size: 13.5px;
      line-height: 1.5;
      color: #e4e4e7;
      font-weight: 500;
    }
    .elicitation-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .elicitation-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f4f4f5;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .elicitation-btn:hover {
      background: rgba(203, 168, 116, 0.12);
      border-color: rgba(203, 168, 116, 0.45);
      color: var(--accent-bright, #ddbd85);
      transform: translateX(3px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .elicitation-btn-content {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
    }
    .elicitation-btn-icon {
      color: var(--accent-bright, #ddbd85);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .elicitation-btn-label {
      font-weight: 500;
    }
    .elicitation-btn-hint {
      font-size: 11.5px;
      color: var(--text-dim);
      font-weight: 600;
      margin-left: 12px;
      flex-shrink: 0;
      opacity: 0.8;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .elicitation-btn:hover .elicitation-btn-hint {
      color: var(--accent-bright, #ddbd85);
      opacity: 1;
      transform: translateX(2px);
    }


    .msg-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 2px;
      opacity: 0.95;
      transition: opacity 0.25s var(--ease);
    }
    .msg.val:hover .msg-actions,
    .msg.val.settled .msg-actions { opacity: 1; }

    .msg-version-nav {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      font-size: 11.5px;
      color: var(--text-dim);
      user-select: none;
      height: 26px;
      box-sizing: border-box;
    }
    .version-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
      height: 100%;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .version-nav-btn:hover:not(:disabled) {
      color: var(--accent-bright);
      background: rgba(203, 168, 116, 0.15);
    }
    .version-nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .version-nav-label {
      font-family: var(--serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0 4px;
      color: var(--text);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(203, 168, 116, 0.24);
      border-radius: 7px;
      color: #ded9cd;
      font-family: var(--serif);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6.5px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.22s var(--ease);
      user-select: none;
    }
    .icon-btn:hover {
      background: rgba(203, 168, 116, 0.08);
      border-color: var(--accent-bright);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .icon-btn:active {
      transform: translateY(0);
    }
    .icon-btn.copied {
      background: transparent;
      border-color: rgba(72, 199, 142, 0.45);
      color: #5edb9c;
    }
    .icon-btn svg {
      width: 13.5px;
      height: 13.5px;
      color: var(--accent-bright);
      stroke-width: 2px;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease), color 0.2s var(--ease);
    }
    .icon-btn.copied svg {
      color: #5edb9c;
    }
    .icon-btn.regen-btn:hover svg {
      transform: rotate(-45deg);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      background: var(--accent-bright);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: smoothCursorPulse 0.85s ease-in-out infinite alternate;
    }
    @keyframes smoothCursorPulse {
      0% { opacity: 0.2; transform: scaleY(0.9); }
      100% { opacity: 1; transform: scaleY(1); }
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      margin-top: 4px;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .typing-indicator span {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 7px rgba(203, 168, 116, 0.45);
      animation: typingSmoothWave 1.35s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform, opacity, box-shadow;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.22s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.44s; }
    @keyframes typingSmoothWave {
      0%, 100% {
        transform: translateY(0) scale(0.82);
        opacity: 0.32;
        box-shadow: 0 0 3px rgba(203, 168, 116, 0.2);
      }
      50% {
        transform: translateY(-5px) scale(1.18);
        opacity: 1;
        box-shadow: 0 0 11px rgba(203, 168, 116, 0.75);
      }
    }

    .error-msg {
      font-size: 13px;
      line-height: 1.6;
      color: #d3a48f;
      background: rgba(196,120,90,0.07);
      border: 1px solid rgba(196,120,90,0.18);
      padding: 13px 17px;
      border-radius: 12px;
      margin-top: 6px;
    }

    /* ---------- Composer ---------- */
    .composer-zone {
      flex-shrink: 0;
      padding: 6px 24px 16px;
      display: flex;
      justify-content: center;
    }
    .composer-wrap { max-width: 820px; width: 100%; margin: 0 auto; box-sizing: border-box; }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, var(--surface-raised), var(--surface));
      border: none;
      border-radius: 26px;
      padding: 8px 10px 8px 12px;
      min-height: 52px;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
      position: relative;
      box-sizing: border-box;
    }
    .composer:focus-within {
      border-color: transparent;
      box-shadow: 0 0 0 3.5px var(--accent-soft), var(--shadow-soft);
    }

    /* Model selector on the left inside composer (Compact & Space-efficient) */
    .composer-model-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin: 0;
      align-self: center;
      height: 30px;
    }
    .composer-model-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-strong);
      border-radius: 15px;
      height: 30px;
      padding: 0 9px;
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s var(--ease);
      max-width: 140px;
      box-sizing: border-box;
      line-height: 1;
      margin: 0;
    }
    .composer-model-btn:hover, .composer-model-btn.open {
      background: var(--accent-soft);
      border-color: var(--accent-dim);
      color: var(--accent-bright);
    }
    .composer-model-spark {
      color: var(--accent-bright);
      font-size: 10.5px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    .composer-model-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 95px;
      font-size: 11px;
      letter-spacing: -0.01em;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-free-badge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 2px 4.5px;
      border-radius: 4px;
      background: rgba(203, 168, 116, 0.18);
      color: var(--accent-bright);
      border: 1px solid rgba(203, 168, 116, 0.32);
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-arrow {
      color: var(--text-faint);
      transition: transform 0.2s var(--ease);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }
    .composer-model-btn.open .composer-model-arrow {
      transform: rotate(180deg);
      color: var(--accent-bright);
    }
    /* Popover = satu-satunya permukaan glass di app (R-10); emas hanya sebagai aksen terpilih (R-01) */
    .composer-model-popover {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 0;
      width: 304px;
      max-width: calc(100vw - 36px);
      z-index: 100;
      background: rgba(19, 19, 24, 0.92);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      box-shadow: 0 24px 56px -16px rgba(0, 0, 0, 0.85);
      padding: 10px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: msgIn 0.2s var(--ease);
    }
    .model-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 8px;
    }
    .model-selector-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .composer textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 22px;
      max-height: 200px;
      padding: 7px 0;
      margin: 0;
      letter-spacing: 0.001em;
      align-self: center;
      box-sizing: border-box;
      display: block;
      overflow-x: hidden;
    }
    .composer textarea::placeholder { color: var(--text-faint); }
    .attachment-input { display: none; }
    .attachment-menu-wrap { position: relative; flex: 0 0 auto; }
    .attachment-btn { width: 30px; height: 30px; padding: 0; border: 0; background: transparent; color: var(--text-faint); display: grid; place-items: center; flex: 0 0 auto; font-size: 25px; font-weight: 300; line-height: 1; }
    .attachment-btn:hover:not(:disabled) { color: var(--accent-bright); }
    .attachment-btn:disabled { opacity: .35; cursor: default; }
    .attachment-menu { position: absolute; bottom: calc(100% + 10px); left: -4px; min-width: 142px; padding: 6px; display: grid; gap: 3px; border: 1px solid var(--border-strong); border-radius: 12px; background: #17171d; box-shadow: 0 16px 38px rgba(0,0,0,.58); z-index: 120; }
    .attachment-menu button { min-height: 36px; border: 0; border-radius: 8px; padding: 8px 10px; background: transparent; color: var(--text-dim); text-align: left; font: inherit; font-size: 12px; display: flex; align-items: center; gap: 9px; transition: background .16s ease, color .16s ease; }
    .attachment-menu button:hover { background: var(--accent-soft); color: var(--accent-bright); }
    .attachment-menu-icon { width: 17px; height: 17px; flex: 0 0 auto; color: var(--accent-bright); opacity: .9; }
    /* Sejajar dengan awal kotak input, bukan terpusat pada lebar berbeda. */
    .composer-attachments { width: 100%; display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 8px; box-sizing: border-box; }
    .composer-attachment { height: 42px; max-width: 190px; padding: 4px 6px 4px 4px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); color: var(--text-dim); font-size: 11px; overflow: hidden; }
    .composer-attachment img { width: 32px; height: 32px; border-radius: 5px; object-fit: cover; }
    .composer-attachment span:not(.attachment-file-icon) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-file-icon { font-size: 8px; padding: 7px 4px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-bright); font-weight: 700; }
    .composer-attachment button { margin-left: auto; border: 0; background: none; color: var(--text-faint); font-size: 17px; line-height: 1; padding: 2px; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #14120d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s var(--ease), opacity 0.25s var(--ease), background 0.25s var(--ease);
      align-self: center;
      margin: 0;
      padding: 0;
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); background: var(--accent-bright); }
    .send-btn:active:not(:disabled) { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.28; cursor: default; }
    .send-btn svg { width: 15px; height: 15px; }

    .composer-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    /* ---------- Authentication ---------- */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 22px; background: rgba(5,5,7,0.72); backdrop-filter: blur(12px);
    }
    .auth-modal {
      width: min(100%, 420px); background: linear-gradient(155deg, var(--surface-raised), var(--surface));
      border: 1px solid var(--border-strong); border-radius: 20px; padding: 30px; box-shadow: 0 28px 80px rgba(0,0,0,0.55);
      animation: msgIn .45s var(--ease) both;
    }
    .auth-title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 27px; color: var(--text); }
    .auth-subtitle { margin: 8px 0 24px; color: var(--text-dim); font-size: 13px; line-height: 1.55; }
    .auth-form { display: grid; gap: 12px; }
    .auth-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .auth-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; outline: none; background: rgba(0,0,0,0.14); color: var(--text); padding: 12px 13px; font: inherit; font-size: 13px; transition: border-color .25s var(--ease), box-shadow .25s var(--ease); }
    .auth-input::placeholder { color: var(--text-faint); }
    .auth-input:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-submit, .google-btn { width: 100%; border-radius: 10px; padding: 12px 15px; font: inherit; font-size: 13px; transition: transform .2s var(--ease), opacity .2s var(--ease), background .2s var(--ease); }
    .auth-submit { border: none; background: var(--accent); color: #14120d; margin-top: 4px; }
    .auth-submit:hover:not(:disabled) { background: var(--accent-bright); transform: translateY(-1px); }
    .google-btn { border: 1px solid var(--border); background: transparent; color: var(--text-dim); }
    .google-btn:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--text); background: var(--accent-soft); }
    .auth-submit:disabled, .google-btn:disabled { opacity: .5; cursor: default; }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--text-faint); font-size: 11px; }
    .auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }
    .auth-toggle { margin: 20px 0 0; font-size: 12px; color: var(--text-dim); text-align: center; }
    .auth-link { padding: 0; border: 0; background: none; color: var(--accent-bright); font: inherit; font-size: inherit; cursor: pointer; }
    .auth-error { margin: 0; color: #d3a48f; font-size: 12px; line-height: 1.45; }

    /* ---------- Chat history ---------- */
    .sidebar { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 260px; padding: 16px 12px; background: #161617; border-right: 1px solid #28282b; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

    .val-usage-percent-badge {

    .val-progress-bar-wrap {

    .val-upgrade-prompt-banner {

    .val-code-tab-btn {

    .val-code-copy-btn {

    .val-code-block {

    .val-account-row {

    .val-account-row:last-child {

    @media (max-width: 1050px) {
      .val-console-topbar {
        height: 64px;
        padding: 0 16px;
      }
      .val-console-mobile-menu {
        display: grid;
        place-items: center;
      }
      .val-console-body {
        grid-template-columns: 1fr;
        position: relative;
        height: calc(100dvh - 64px);
      }
      .val-console-sidebar {
        display: flex;
        position: fixed;
        z-index: 40;
        top: 64px;
        bottom: 0;
        left: 0;
        width: min(280px, calc(100vw - 30px));
        height: auto;
        padding: 14px 10px 28px;
        background: #171718;
        border-right: 1px solid #303033;
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: 18px 0 36px rgba(0, 0, 0, 0.5);
      }
      .val-console-sidebar.mobile-open {
        transform: translateX(0);
      }
      .val-console-mobile-backdrop {
        display: block;
        position: fixed;
        z-index: 35;
        inset: 64px 0 0;
        border: 0;
        background: rgba(0, 0, 0, 0.48);
        cursor: pointer;
      }
      .val-console-content {
        padding: 24px 16px 60px;
        height: 100%;
        overflow-y: auto;
      }
      .val-console-two-grid {
        grid-template-columns: 1fr;
      }
      .val-key-input-row {
        flex-direction: column;
        align-items: stretch;
      }
      .val-key-copy-btn {
        justify-content: center;
      }
      .val-upgrade-prompt-banner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    /* Responsive Developer & Docs Layout */
    @media (max-width: 1200px) {
      .developer-layout { grid-template-columns: 260px minmax(0, 1fr); }
      .developer-toc { display: none; }
    }
    @media (max-width: 1024px) {
      .developer-page { padding: 0; overflow: hidden; height: 100dvh; }
      .developer-topbar { height: 56px; padding: 0 12px; gap: 8px; justify-content: space-between; }
      .developer-wordmark { font-size: 14px; gap: 7px; }
      .developer-wordmark img { width: 30px; height: 30px; border-radius: 7px; }
      .developer-wordmark b { font-size: 13.5px; }
      .developer-wordmark small { font-size: 8px; }
      .developer-mobile-menu { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; color: var(--text); }
      .developer-mobile-menu:hover { background: rgba(255, 255, 255, 0.06); }
      .developer-topbar nav { display: none; }
      .developer-topbar-actions button:first-child { display: none; }
      .developer-topbar-actions .developer-console-btn { padding: 6px 12px; font-size: 11.5px; }
      .developer-shell { overflow: hidden; height: calc(100dvh - 56px); }
      .developer-layout { display: block; height: 100%; position: relative; }
      .developer-doc-nav {
        display: block !important;
        position: fixed !important;
        z-index: 1000 !important;
        top: 56px;
        bottom: 0;
        left: 0;
        width: min(300px, 86vw);
        height: calc(100dvh - 56px);
        box-sizing: border-box;
        padding: 14px 10px 32px;
        transform: translateX(-105%);
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 18px 0 36px rgba(0, 0, 0, 0.65);
        background: #171718;
        border-right: 1px solid #303033;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .developer-doc-nav.mobile-open { transform: translateX(0) !important; }
      .developer-mobile-backdrop {
        display: block !important;
        position: fixed !important;
        z-index: 999 !important;
        inset: 56px 0 0 0;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(2px);
        cursor: pointer;
      }
      .developer-article {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 24px 16px 80px;
        min-width: 0;
        box-sizing: border-box;
      }
      .developer-article > * { max-width: 100%; }
      .developer-article h1 { font-size: clamp(24px, 5.5vw, 32px); line-height: 1.15; }
      .developer-article h2 { font-size: 19px; margin-top: 28px; margin-bottom: 10px; }
      .developer-lead { font-size: 13.5px; margin-bottom: 20px; line-height: 1.6; }
      .developer-section { padding: 14px 14px 16px; margin-top: 10px; margin-bottom: 16px; border-radius: 8px; }
      .developer-section-top { flex-wrap: wrap; gap: 8px; justify-content: space-between; }
      .developer-section-top > div { flex-wrap: wrap; gap: 6px; }
      .developer-table th, .developer-table td { padding: 9px 10px; font-size: 12px; }
      .developer-card-grid { grid-template-columns: 1fr; gap: 10px; }
    }
    @media (max-width: 480px) {
      .developer-wordmark span { display: none; }
      .developer-topbar { padding: 0 10px; }
      .developer-article { padding: 18px 12px 70px; }
      .developer-section pre { padding: 10px; font-size: 11px; }
      .developer-table th, .developer-table td { padding: 8px 8px; font-size: 11.5px; }
    }

    .sidebar-tools button:hover { background: var(--accent-soft); color: var(--text); }

    .sidebar-toggle { display: grid; place-items: center; position: fixed; z-index: 31; top: 18px; left: 16px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--text-dim); font-size: 21px; }

    /* ---------- Model picker (popover composer) ---------- */
    /* Alasan (R-31): satu aksen emas pada elemen terpilih (R-01), tanpa glow (R-13),

    .model-tags-wrap {

    .model-item.locked { opacity: 0.7; }

    }
    .model-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 9px; border-radius: 9px;
      background: transparent; border: 1px solid transparent;

      width: 100%;
    }
    .model-item:hover { background: var(--accent-soft); }

    .model-item-info { flex: 1; min-width: 0; }

    .model-item-desc {

    }
    .agent-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .agent-control-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      border: 1px solid var(--border);
    }
    .agent-control-btn.pause {
      background: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.3);
      color: #fbbf24;
    }
    .agent-control-btn.pause:hover {
      background: rgba(251, 191, 36, 0.2);
    }
    .agent-control-btn.resume {
      background: rgba(74, 222, 128, 0.12);
      border-color: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    .agent-control-btn.resume:hover {
      background: rgba(74, 222, 128, 0.22);
    }
    .agent-control-btn.reset {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
    }
    .agent-control-btn.reset:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .agent-control-btn.exit {
      background: transparent;
      color: var(--text-dim);
    }
    .agent-control-btn.exit:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    /* Progress Ribbon */
    .agent-progress-ribbon {
      padding: 8px 24px 10px 76px;
      background: #0e0e12;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .agent-progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .agent-progress-pct {
      font-weight: 600;
      color: var(--accent-bright);
    }
    .agent-progress-track {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .agent-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #cba874, #4ade80);
      transition: width 0.4s ease;
    }

    /* Main Split Layout */
    .agent-main-layout {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* Left Sidebar: 13-Stage Roadmap */
    .agent-stages-sidebar {
      width: 290px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: #0c0c10;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .agent-sidebar-header {
      padding: 12px 14px 12px 64px;
      min-height: 52px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .agent-sidebar-header h4 {
      margin: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }
    .agent-sidebar-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-task-count {
      font-size: 11px;
      color: var(--accent-bright);
      font-weight: 600;
      background: rgba(203, 168, 116, 0.1);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .agent-mini-btn {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .agent-mini-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .agent-stages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .agent-stage-group {
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      padding: 8px 10px;
      transition: all 0.2s var(--ease);
    }
    .agent-stage-group.active {
      border-color: rgba(203, 168, 116, 0.4);
      background: rgba(203, 168, 116, 0.06);
    }
    .agent-stage-group.completed {
      border-color: rgba(74, 222, 128, 0.2);
    }
    .agent-stage-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .agent-stage-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      flex-shrink: 0;
    }
    .agent-stage-group.completed .agent-stage-num {
      background: #4ade80;
      color: #111;
      font-weight: 700;
    }
    .agent-stage-group.active .agent-stage-num {
      background: var(--accent-bright);
      color: #111;
      font-weight: 700;
    }
    .agent-stage-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .agent-stage-tasks-list {
      margin-top: 6px;
      padding-left: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .agent-task-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .agent-task-icon {
      font-size: 10px;
      width: 12px;
      text-align: center;
      flex-shrink: 0;
    }
    .agent-task-item.completed {
      color: #4ade80;
    }
    .agent-task-item.running {
      color: #e0c393;
      font-weight: 600;
    }
    .agent-task-item.verifying {
      color: #fbbf24;
    }

    /* Right Pane: Workspace & Tabs */
    .agent-workspace-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
      min-height: 0;
    }
    .agent-tab-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      min-height: 52px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--border);
      background: #0f0f13;
      flex-shrink: 0;
    }
    .agent-tab-btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .agent-tab-btn:hover {
      color: var(--text);
    }
    .agent-tab-btn.active {
      background: var(--surface-raised);
      border-color: var(--border-strong);
      color: var(--accent-bright);
    }

    /* Workspace Content */
    .agent-workspace-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    /* Idle Hero */
    .agent-idle-hero {
      max-width: 640px;
      margin: 40px auto;
      text-align: center;
    }
    .agent-idle-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(203, 168, 116, 0.1);
      color: var(--accent-bright);
      margin: 0 auto 16px;
      border: 1px solid rgba(203, 168, 116, 0.25);
    }
    .agent-idle-hero h3 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 10px;
    }
    .agent-idle-hero p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-dim);
      margin: 0 0 24px;
    }
    .agent-start-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .agent-topic-input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: #131318;
      color: #fff;
      padding: 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      box-sizing: border-box;
      line-height: 1.5;
    }
    .agent-topic-input:focus {
      outline: none;
      border-color: var(--accent-dim);
      box-shadow: 0 0 12px rgba(203, 168, 116, 0.15);
    }
    .agent-quick-prompts-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 11.5px;
    }
    .agent-prompt-lead {
      color: var(--text-sub);
    }
    .agent-quick-chip {
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .agent-quick-chip:hover {
      background: var(--accent-soft);
      border-color: rgba(203, 168, 116, 0.3);
      color: var(--accent-bright);
    }
    .agent-start-btn {
      padding: 12px 24px;
      border-radius: 10px;
      background: var(--accent-bright);
      color: #111;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
      align-self: flex-start;
      margin-top: 4px;
    }
    .agent-start-btn:hover:not(:disabled) {
      transform: scale(1.02);
      background: #e2c18d;
    }
    .agent-start-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Live Execution Banner */
    .agent-live-execution-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .agent-active-task-banner {
      padding: 16px 20px;
      border-radius: 12px;
      background: #131318;
      border: 1px solid var(--border);
    }
    .agent-task-badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .agent-status-pill {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .agent-status-pill.running {
      background: rgba(224, 195, 147, 0.15);
      color: #e0c393;
      border: 1px solid rgba(224, 195, 147, 0.4);
    }
    .agent-status-pill.verifying {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.4);
    }
    .agent-status-pill.waiting_user_input,
    .agent-status-pill.waiting_for_user_data {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      border: 1px solid rgba(249, 115, 22, 0.4);
    }
    .agent-status-pill.paused {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .agent-status-pill.completed {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }
    .agent-current-stage-tag {
      font-size: 11.5px;
      color: var(--text-sub);
    }
    .agent-active-task-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    /* Live Output Box */
    .agent-stream-output-box {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f0f13;
      overflow: hidden;
    }
    .output-header {
      padding: 10px 16px;
      background: #16161c;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stream-badge {
      font-size: 10px;
      font-weight: 600;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .output-body {
      padding: 16px;
      max-height: 380px;
      overflow-y: auto;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.7;
      color: #e4e2de;
    }
    .output-body pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      margin: 0;
    }
    .stream-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 30px;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Verification Card */
    .agent-verify-card {
      padding: 14px 18px;
      border-radius: 10px;
      background: rgba(74, 222, 128, 0.06);
      border: 1px solid rgba(74, 222, 128, 0.3);
      font-size: 12.5px;
    }
    .verify-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      color: #4ade80;
      margin-bottom: 6px;
    }
    .verify-badge {
      background: #4ade80;
      color: #111;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .verify-message {
      margin: 0;
      color: #d1d5db;
    }

    /* Checkpoint Card */
    .agent-checkpoint-card {
      padding: 20px;
      border-radius: 12px;
      background: #16161d;
      border: 1px solid rgba(249, 115, 22, 0.4);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .checkpoint-badge {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #f97316;
      letter-spacing: 0.05em;
    }
    .agent-checkpoint-card h4 {
      margin: 0;
      font-size: 15px;
      color: #fff;
    }
    .agent-checkpoint-card p {
      margin: 0;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .checkpoint-title-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title-opt-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s var(--ease);
    }
    .title-opt-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .title-opt-item.selected {
      border-color: var(--accent-bright);
      background: rgba(203, 168, 116, 0.1);
      color: #fff;
    }
    .custom-title-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .custom-title-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #101014;
      color: #fff;
      box-sizing: border-box;
      font-size: 13px;
    }
    .checkpoint-action-btn {
      padding: 10px 20px;
      border-radius: 8px;
      background: var(--accent-bright);
      color: #111;
      font-weight: 600;
      border: none;
      cursor: pointer;
      align-self: flex-start;
      font-size: 13px;
      transition: transform 0.2s;
    }
    .checkpoint-action-btn:hover:not(:disabled) {
      transform: scale(1.02);
    }
    .checkpoint-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .checkpoint-action-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 6px;
    }
    .dataset-drop-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
    }
    .dataset-drop-box:hover {
      border-color: var(--accent-bright);
      background: rgba(203, 168, 116, 0.04);
    }
    .drop-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent-bright);
    }
    .file-input-hidden {
      display: none;
    }
    .dataset-fallback-option {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
    }
    .custom-data-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #101014;
      color: #fff;
      box-sizing: border-box;
      font-size: 13px;
      font-family: inherit;
      resize: none;
    }

    /* Final Gate Card */
    .agent-final-gate-card {
      padding: 28px;
      border-radius: 14px;
      text-align: center;
      background: linear-gradient(135deg, rgba(203, 168, 116, 0.12), rgba(74, 222, 128, 0.08));
      border: 1px solid rgba(203, 168, 116, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .final-celebrate-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(74, 222, 128, 0.12);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    .agent-final-gate-card h3 {
      margin: 0;
      font-size: 20px;
      color: #fff;
    }
    .agent-final-gate-card p {
      margin: 0;
      font-size: 13.5px;
      color: var(--text-dim);
      max-width: 580px;
      line-height: 1.6;
    }
    .agent-download-docx-btn {
      padding: 14px 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e0c393, #cba874);
      color: #111;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(203, 168, 116, 0.35);
      transition: transform 0.2s;
      margin-top: 8px;
    }
    .agent-download-docx-btn:hover {
      transform: scale(1.03);
    }

    /* Document Inspector */
    .agent-doc-inspector {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .doc-inspector-nav {
      display: flex;
      gap: 6px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .doc-subnav-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .doc-subnav-btn:hover {
      color: var(--text);
    }
    .doc-subnav-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent-bright);
      color: var(--accent-bright);
      font-weight: 600;
    }
    .doc-inspector-sheet {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .chapter-content-view h3, .audit-sheet h3 {
      margin: 0 0 16px;
      font-size: 18px;
      color: var(--accent-bright);
    }
    .chapter-text-body {
      white-space: pre-wrap;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.75;
      color: #ece7de;
      margin: 0;
    }
    .chapter-empty-hint {
      color: var(--text-sub);
      font-style: italic;
      font-size: 13px;
    }
    .audit-checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .audit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #131318;
      font-size: 13px;
    }
    .audit-row.passed {
      border-color: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    .audit-row.pending {
      color: var(--text-dim);
    }
    .audit-status {
      font-weight: 700;
      font-size: 11px;
    }

    /* Terminal View */
    .agent-terminal-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #0a0a0d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #111116;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }
    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .terminal-dot.red { background: #ef4444; }
    .terminal-dot.yellow { background: #f59e0b; }
    .terminal-dot.green { background: #10b981; }
    .terminal-title { margin-left: 6px; }
    .terminal-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;

  <div class="app">

      </div>

      <div class="conversation-inner" id="conversationInner"></div>
    </div>

      <div class="composer-wrap" id="chatComposerWrap"></div>
    </div>
  </div>

    <div class="composer">
      <textarea rows="1" placeholder="Message M Putra Ramadhani…" id="composerInput"></textarea>

        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
